[target.msp430-none-elf]
# For debugging
# runner = "msp430-elf-gdb -q -x mspdebug.gdb"
# For running
runner = "./run.sh"

rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-mcpu=msp430",

    # Use the 32-bit hardware multiplier (MPY32) at 04C0h, which every supported device has (MPY_TYPE 8 in
    # msp430-gcc's include/devices.csv). libmul_32 is for MPY_TYPE 4 devices, with the MPY32 at 0130h,
    # which is PM5CTL0 on these devices. On the MSP430FR2433: MPY32 at 04C0h (SLASE59F Table 6-24, p. 62),
    # and PM5CTL0 at offset 10h of the PMM's 0120h (SLASE59F Table 6-24, p. 62; SLASE59F Table 6-26, p. 62).
    # MPY_TYPE comes from msp430-gcc, not from a TI document listed in REFERENCES.md.
    "-C", "link-arg=-lmul_f5",
    
    # libgcc must be linked after everything that depends on it (e.g. lmul_f5)
    "-C", "link-arg=-lgcc",
]

[build]
target = "msp430-none-elf"

[unstable]
# MSP430 doesn't come with libcore compiled already. But when it does, this
# key can be removed.
build-std = ["core"]
