[package]
name = "msp430fr2355-hal-examples"
version = "0.0.1"
authors = ["Ross Porter <rossporter506@gmail.com>"]
edition = "2021"
description = "MSP430FR2355 examples using the msp430fr2x5x-hal"
publish = false
keywords = ["no-std", "msp430", "ti", "launchpad", "embedded-hal"]

[dependencies]
defmt = "1.0"
defmt-serial = { version = "0.14", optional = true }
panic-msp430 = "0.4.0"
panic-never = "0.1.0"
msp430 = {version = "0.4.1", features = ["critical-section-single-core"]}
msp430-rt = "0.4.0"
msp430fr2355 = { version = "0.7.0", features = ["rt", "critical-section"] }
msp430-hal = {path = "../../hal", features = ["msp430fr2355", "defmt"]}
critical-section = "1.2.0"
msp430-atomic = "0.1.5"
embedded-hal = "1.0"
embedded-hal-nb = "*"
embedded-io = "0.7"
nb = "1.1.0"
portable-atomic = { version = "1.13", default-features = false }
static_cell = "2.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"

[profile.dev]
opt-level = "s"
codegen-units = 1
debug = true

[profile.dev.package."*"]
opt-level = "z"

# defmt-serial requires rust 2024, which came out after our MSRV.
# The MSRV tests are run with --no-default-features to avoid pulling this in.
[features]
default = ["dep:defmt-serial"]
