[package]
name = "msp430-hal"
version = "0.8.0"
authors = ["YuhanLiin <linyuhan0315@hotmail.com>, RossPorter506 <rossporter506@gmail.com>"]
edition = "2018"
description = "Implementation of embedded-hal for MSP430 microcontrollers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YuhanLiin/msp430-hal"
keywords = ["no-std", "msp430", "ti", "launchpad", "embedded-hal"]
documentation = "https://docs.rs/msp430-hal"
readme = "../README.md"

[features]
default = []
embedded-hal-02 = ["dep:embedded-hal-02", "dep:void"]
# defmt::Format for the HAL's types, and for the PAC enums it re-exports, such as `pmm::ResetCause`
defmt = ["dep:defmt", "msp430fr2355?/defmt", "msp430fr2433?/defmt", "msp430fr247x?/defmt", "msp430fr25x2?/defmt"]

# Device features. Provide exactly one of these.
# MSP430FR2x5x: SLASEC4D Table 3-1, p. 8
msp430fr2355 = ["2x5x", "sac_l3"] # 32kB FRAM + SAC unit
msp430fr2353 = ["2x5x", "sac_l3"] # 16kB FRAM + SAC unit
msp430fr2155 = ["2x5x"]           # 32kB FRAM
msp430fr2153 = ["2x5x"]           # 16kB FRAM
# MSP430FR2433: SLASE59F Table 3-1, p. 7
msp430fr2433 = ["dep:msp430fr2433", "eusci_modclk", "adc", "adcpctl", "eusci_b", "info_mem", "lpm3_5_switch", "tlv_hw_revision", "erratum_cs13", "erratum_pmm32", "erratum_gc5", "erratum_rtc15", "erratum_port28"]
# MSP430FR247x: SLASEO7C Table 6-1, p. 6
msp430fr2475 = ["247x"]           # 6kB RAM
msp430fr2476 = ["247x"]           # 8kB RAM
# MSP430FR25x2: SLASEE4C 1.1, p. 2 (family members) and SLASEE4C Table 3-1, p. 8
msp430fr2512 = ["25x2"]           # 2kB RAM up to 4 self-capacitive or mutual-capacitive sensors
msp430fr2522 = ["25x2", "frwpoa"] # 2kB RAM up to 8 self-capacitive and 16 mutual-capacitive sensors

# Derived features. Do not provide these.
2x5x = ["dep:msp430fr2355", "eusci_aclk", "info_mem", "enhanced_ref", "adc", "ecomp", "eusci_b", "vloclk_source", "xt1_high_frequency", "enhanced_cs", "rtc_aclk", "frwpoa", "icc", "mfm", "timer_b", "tlv_hw_revision", "erratum_cs13", "erratum_pmm32", "erratum_rtc15"]
247x = ["dep:msp430fr247x", "eusci_aclk", "info_mem", "enhanced_ref", "adc", "ecomp", "eusci_b", "vloclk_source", "rtc_aclk", "timer_b", "remap"]
25x2 = ["dep:msp430fr25x2", "eusci_aclk", "info_mem", "adc", "adcpctl", "eusci_b", "rtc_aclk", "lpm3_5_switch", "erratum_cs13", "erratum_pmm32", "erratum_rtc15", "remap"]
# UCSSEL = 01b selects ACLK: SLASEC4D Table 6-9, p. 68; SLASEO7C Table 9-8, p. 50; SLASEE4C Table 6-8, p. 49
eusci_aclk = [] # eUSCI peripherals can source from ACLK
# UCSSEL = 01b selects MODCLK: SLASE59F Table 6-7, p. 46
eusci_modclk = [] # eUSCI peripherals can source from MODCLK
# SYSCFG2.ADCPCTLx: SLAU445I Table 1-31, p. 82; SLASE59F Table 6-17, p. 55; SLASEE4C Table 6-15, p. 58
adcpctl = [] # ADC functionality controlled via ADCPCTLx
# Remapping bits in SYSCFG2 and SYSCFG3 (SLAU445I Table 1-31, p. 82; SLAU445I Table 1-32, p. 83): eUSCI pins
# on the MSP430FR247x and MSP430FR25x2 (SLASEO7C Table 9-11, p. 54; SLASEE4C Table 6-11, p. 53), TA2 and TA3
# pins on the MSP430FR247x (SLASEO7C Table 9-16, p. 60)
remap = [] # Peripherals whose pins move with a remapping bit
# ADC on every device: 12-bit on the MSP430FR2x5x and MSP430FR247x (SLASEC4D Table 3-1, p. 8; SLASEO7C
# Table 6-1, p. 6), 10-bit on the MSP430FR2433 and MSP430FR25x2 (SLASE59F Table 3-1, p. 7; SLASEE4C
# Table 3-1, p. 8). The PAC's ADCRES enum has the resolutions of each.
adc = []
# Two eCOMP on the MSP430FR2x5x (SLASEC4D Table 3-1, p. 8), one on the MSP430FR247x (SLASEO7C Table 6-1, p. 6)
ecomp = []
# Internal shared reference of 1.5, 2.0 or 2.5 V (SLAU445I 2.1, p. 85): SLASEC4D 1.1, p. 1 and SLASEC4D
# Table 5-10, p. 41; SLASEO7C 8.12.5.1, p. 33
enhanced_ref = []
# The LPM3.5 switch (LPM5SM, LPM5SW): "Only available in the FR203x, FR211x, FR2100, FR2000, FR231x, FR2433,
# FR2422, FR263x, FR253x, FR252x, and FR413x devices" (SLAU445I Table 2-7, p. 97)
lpm3_5_switch = []
# eUSCI_B: SLASEC4D Table 3-1, p. 8; SLASE59F Table 3-1, p. 7; SLASEO7C Table 6-1, p. 6;
# SLASEE4C Table 3-1, p. 8
eusci_b = []
# SAC-L3, MSP430FR235x only: SLASEC4D 1.1, p. 1 and SLASEC4D Table 3-1, p. 8
sac_l3 = ["sac"]
sac_l1 = ["sac"]
sac = []
tia = []
# Information FRAM: SLASEC4D Table 6-4, p. 65; SLASE59F Table 6-23, p. 61; SLASEO7C Table 9-31, p. 73;
# SLASEE4C Table 6-19, p. 62
info_mem = []
# ACLK from XT1, VLO or REFO: SLASEC4D 6.10.2, p. 68; SLASEO7C 9.10.2, p. 49
vloclk_source = [] # ACLK can be sourced from VLOCLK
# XT1 up to 24 MHz: SLASEC4D Table 5-4, p. 36
xt1_high_frequency = [] # XT1 supports 1 MHz to 24 MHz crystals and inputs besides 32 kHz
# Enhanced CS on the MSP430FR235x and MSP430FR215x: SLAU445I Table 3-1, p. 98
enhanced_cs = [] # Enhanced clock system: 20/24 MHz DCO, XT1FAULTOFF, low-power REFO
# RTCSS = 01b, note 1: SLASEC4D Table 6-9, p. 68; SLASEO7C Table 9-8, p. 50; SLASEE4C Table 6-8, p. 49
rtc_aclk = [] # RTC can be sourced from ACLK, through SYSCFG2.RTCCKSEL
icc = [] # Interrupt Compare Controller (SLASEC4D 6.10.7, p. 71)
mfm = [] # Manchester Function Module (SLASEC4D 6.10.14, p. 79)
# Timer_B on the MSP430FR2x5x (SLASEC4D Table 3-1, p. 8) and the MSP430FR247x (SLASEO7C Table 6-1, p. 6); the
# MSP430FR2433 and MSP430FR25x2 have only Timer_A (SLASE59F Table 3-1, p. 7; SLASEE4C Table 3-1, p. 8)
timer_b = []
# FRWPOA is valid "only in the MSP430FR235x and MSP430FR215x devices" (SLAU445I Table 1-24, note 2, p. 75)
# and "in MSP430FR2522 and MSP430FR2422 devices" (SLAU445I Table 1-29, note 3, p. 80)
frwpoa = [] # Part of the program FRAM can be left writable, through SYSCFG0.FRWPOA
# The hardware revision in the device descriptors (TLV, 1A06h). The errata sheets of the MSP430FR2x5x and
# the MSP430FR2433 give its value (SLAZ695J 5.3, p. 5; SLAZ664S 5.3, p. 4); those of the MSP430FR247x and
# the MSP430FR25x2 say "This device does not support reading the hardware revision from memory" (SLAZ726B
# 5.3, p. 4; SLAZ705H 5.3, p. 4).
tlv_hw_revision = []
# Silicon errata the HAL works around. Each device has its own errata sheet, and the sheets of a family
# list the same errata with the same text on the same pages, so the comments cite the first one:
# - MSP430FR2x5x: SLAZ695J (MSP430FR2355), SLAZ696H (MSP430FR2353), SLAZ722H (MSP430FR2155), SLAZ723H
#   (MSP430FR2153)
# - MSP430FR2433: SLAZ664S
# - MSP430FR247x: SLAZ726B (MSP430FR2476), SLAZ727B (MSP430FR2475), which list none of these errata
# - MSP430FR25x2: SLAZ705H (MSP430FR2522), SLAZ708H (MSP430FR2512)
# LPM3/LPM4 entry can lock up with the DCO above 2 MHz (SLAZ695J CS13, p. 8 to p. 9; SLAZ664S CS13, p. 9
# to p. 10; SLAZ705H CS13, p. 7 to p. 8)
erratum_cs13 = []
# LPM3/LPM4 entry can lock up or run unintended code (SLAZ695J PMM32, p. 9 to p. 11; SLAZ664S PMM32, p. 11
# to p. 12; SLAZ705H PMM32, p. 8 to p. 10)
erratum_pmm32 = []
# FRAM bit errors reported after LPM1 to LPM4 that don't exist (SLAZ664S GC5, p. 10 to p. 11)
erratum_gc5 = []
# The RTC hangs when moved off a stopped XT1CLK (SLAZ695J RTC15, p. 11; SLAZ664S RTC15, p. 13; SLAZ705H
# RTC15, p. 10)
erratum_rtc15 = []
# Clearing SYSRSTRE also disables the TEST pin's pull-down, so `sys::RstPull` has no `None` (SLAZ664S
# PORT28, p. 12 to p. 13)
erratum_port28 = []

[dependencies]
defmt = {version = "1.0", optional = true }
msp430 = "0.4.0"
msp430fr2355 = { version = "0.7.0", features = ["rt", "critical-section"], optional = true }
msp430fr2433 = { version = "0.3.0", features = ["rt", "critical-section"], optional = true }
msp430fr247x = { version = "0.4.0", features = ["rt", "critical-section"], optional = true }
msp430fr25x2 = { version = "0.4.0", features = ["rt", "critical-section"], optional = true }
nb = "1.1"
critical-section = "1.0.0"
void = { version = "1.0.2", default-features = false, optional = true }
embedded-hal-02 = { package = 'embedded-hal', version = "0.2.7", features = ["unproven"], optional = true }
embedded-hal = { version = "1.0" }
embedded-hal-nb = { version = "1.0" }
embedded-io = "0.7"
bitflags = "2.9"

[dev-dependencies]
panic-msp430 = "0.4.0"
panic-never = "0.1.0"
msp430-rt = "0.4.1"
critical-section = "1.0.0"
msp430 = { version = "0.4.0", features = ["critical-section-single-core"] }
msp430-atomic = "0.1.5"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"

[profile.dev]
opt-level = "s"
codegen-units = 1
debug = true

[profile.dev.package."*"]
opt-level = "z"

[package.metadata.docs.rs]
targets = ["msp430-none-elf"]
features = ["msp430fr2355"]
cargo-args = ["-Z", "build-std=core"]
